version: 2

updates:
  # Grouping collapses a week's worth of bumps into one PR per ecosystem, so
  # the CI gates (pre-commit, tests, strict docs build) run once over the
  # whole batch instead of once per dependency.
  #
  # cooldown holds a release for 10 days before proposing it -- long enough for
  # a compromised or broken publish to be yanked upstream before it reaches a
  # branch here.
  #
  # commit-message gives every Dependabot PR a Conventional Commits title
  # ("build(deps): bump ...", "ci(deps): bump ..."). Without it Dependabot titles
  # its PRs "Bump the all group ...", which validate_pr_title.yaml rejects.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"
    cooldown:
      default-days: 10
    # pulp 4.0 removed the API the chapters use (LpVariable.dicts, LpStatus), which is why pyproject.toml
    # pins it >=3,<4; without this rule the group PR widens the pin and fails the tests.
    ignore:
      - dependency-name: "pulp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"
    cooldown:
      default-days: 10

  # Keeps the SHA-pinned `uses:` in the composite actions under
  # .github/actions/ updated too -- Dependabot does not find them via the
  # workflows directory alone.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/install-uv"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 10

  # pre-commit hook revs (cooldown is not supported for this ecosystem).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"
