name: docs

# Two kinds of publish, both with mike:
#   - a release tag publishes that version and moves `latest` to it, so
#     numbered versions always match their tags;
#   - a push to main that touches the book (or a manual run) publishes the
#     `dev` version, so the site can be refreshed without cutting a tag.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - docs/**
      - includes/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions: {}

# Never cancel a half-finished deploy: mike pushes commits to gh-pages, and an
# interrupted run can leave the branch inconsistent.
concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # mike needs the gh-pages branch and the tag history
          fetch-tags: true

      - uses: ./.github/actions/setup-python
        with:
          sync-args: "--group doc --frozen"

      - name: Configure the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The course is not a package, so there is no installed version to read:
      # a tag push publishes that tag; anything else (a push to main, a manual
      # run) publishes `dev`.
      - name: Resolve the version to publish
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "DOCS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "DOCS_ALIAS=latest" >> "$GITHUB_ENV"
          else
            echo "DOCS_VERSION=dev" >> "$GITHUB_ENV"
            echo "DOCS_ALIAS=" >> "$GITHUB_ENV"
          fi

      # $DOCS_ALIAS is deliberately unquoted: empty for dev (no alias moves),
      # `latest` for a release.
      - name: Deploy with mike
        run: |
          set -euo pipefail
          uv run --frozen mike deploy --push --update-aliases "$DOCS_VERSION" $DOCS_ALIAS

      - name: Make latest the default version
        if: github.ref_type == 'tag'
        run: uv run --frozen mike set-default --push latest
