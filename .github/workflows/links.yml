name: links

# The link check is the slow part of CI (live HTTP requests with retries), so
# it is its own workflow: it does not hold up lint and tests, and it gets its
# own status badge. A PR only checks the Markdown files it changes. A change to
# the link-check config or the hook definition can affect every file, and main
# and the weekly schedule always check everything.

on:
  push:
    branches: [main]
  pull_request:
  # Links rot without any file changing, and PRs only check the files they
  # touch, so a weekly run re-checks everything.
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the PR diff needs the base branch

      - uses: ./.github/actions/setup-python

      - name: Configure pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      - name: Check links
        run: |
          set -euo pipefail
          scope=(--all-files)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$GITHUB_BASE_REF"
            if ! git diff --name-only "$base"...HEAD | grep -qE '^(\.markdown-link-check\.json|\.pre-commit-config\.yaml)$'; then
              scope=(--from-ref "$base" --to-ref HEAD)
            fi
          fi
          SKIP=no-commit-to-branch uv run --frozen pre-commit run markdown-link-check "${scope[@]}"
