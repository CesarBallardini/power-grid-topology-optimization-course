name: links

# The link check is slow (live HTTP requests with retries) and flaky for
# reasons outside the repo, so it does not run while a PR is opened or
# updated. It runs once the PR is merged (the push to main), weekly because
# links rot without any file changing, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      - name: Configure pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      - name: Check links
        run: SKIP=no-commit-to-branch uv run --frozen pre-commit run markdown-link-check --all-files
