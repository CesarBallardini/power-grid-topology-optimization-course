# Gitleaks configuration.
#
# `gitleaks dir` walks the working tree, which includes directories git itself
# ignores. .venv alone is well over 100 MB of third-party code, full of sample
# keys and test fixtures vendored inside other people's packages -- none of it
# authored here and none of it ever committed, so it is not a place a secret
# of ours can leak from.
#
# This does not weaken the commit-time check: the pre-commit hook runs
# `gitleaks git --staged`, which only ever sees staged files, and these are
# gitignored. What it fixes is an ad hoc whole-tree scan
# (`gitleaks dir . --redact -c .gitleaks.toml`).
#
# Character class [\/] rather than a bare /: finding paths use the host
# separator, so the patterns have to match backslashes on Windows too.

[extend]
useDefault = true

[[allowlists]]
description = "Generated, vendored and cached directories -- never committed"
paths = [
  '''(^|[\/])\.venv[\/]''',
  '''(^|[\/])node_modules[\/]''',
  '''(^|[\/])site[\/]''',
  '''(^|[\/])\.cache[\/]''',
  '''(^|[\/])\.pytest_cache[\/]''',
  '''(^|[\/])\.ruff_cache[\/]''',
  # Gitignored local book copies: tens of MB of PDF and OCR text, never committed.
  '''(^|[\/])books[\/](es-ocr|free)[\/]''',
]
